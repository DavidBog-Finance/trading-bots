# FLOW LOG: a learning notebook for options-flow alerts (Unusual Whales or anywhere). It never trades.
# You send alerts from your phone (Safari: ntfy.sh/<FLOW_TOPIC name>) (one per line, e.g. "AAPL 12/20 230C ask $250K sweep").
# Every 2 hours this job reads them, and after each close it fills in what the stock did 1 trading day and
# 1 trading week later, next to SPY. 1-day results come after each close; 1-week results and the scorecard
# come together on Friday evening, in your normal ntfy alerts.
# After each close it also scans your watchlist's options for unusually big new volume (free Alpaca data)
# and logs the top few automatically, tagged "scan" (see flowlog/scan.py).
#
# Secrets: ALPACA_API_KEY, ALPACA_SECRET_KEY (already set; only used for daily prices), NTFY_TOPIC,
#          FLOW_TOPIC (new: another long random name, e.g. flow-7f3k9q2m8x)
#
# PUBLIC REPO NOTE: this job prints only counts, never your alerts. Unusual Whales data is for personal
# use and may not be redistributed, so do not commit the log to this repo; the export button below makes a
# 1-day download instead.
name: flow-log

on:
  schedule:
    - cron: "23 */2 * * *"     # every 2 hours, every day (ntfy keeps phone messages ~12 hours)
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: add
        type: choice
        options: [add, report, list, export, scan]
      alert:
        description: "For add: alert text, e.g. AAPL 12/20 230C ask $250K sweep"
        required: false
        type: string

concurrency:
  group: flow-log
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.RUNNER != 'box'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FLOW_TOPIC: ${{ secrets.FLOW_TOPIC }}
      ALPACA_PAPER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_flowlog.py

      - name: Restore the log
        uses: actions/cache/restore@v4
        with:
          path: logs/flowlog.db
          key: flow-state-${{ github.run_id }}
          restore-keys: flow-state-

      - name: Add an alert typed in GitHub
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'add' && inputs.alert != ''
        env:
          ALERT_TEXT: ${{ inputs.alert }}
        run: python -m flowlog add "$ALERT_TEXT" > /dev/null
      - name: Read phone alerts, fill results, after-close scan
        run: python -m flowlog run --scan
      - name: Scan the last closed session now
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'scan'
        run: python -m flowlog scan
      - name: Scorecard to phone
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'report'
        run: python -m flowlog report > /dev/null
      - name: Last 10 alerts to phone
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'list'
        run: python -c "from flowlog import app; app.say(app.command('list'))"
      - name: Export CSV
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'export'
        run: python -m flowlog export logs/flowlog.csv > /dev/null
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'export'
        with:
          name: flowlog
          path: logs/flowlog.csv
          retention-days: 1

      - name: Save the log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/flowlog.db
          key: flow-state-${{ github.run_id }}
