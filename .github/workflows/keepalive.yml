# KEEPALIVE: GitHub switches off scheduled workflows in public repos after 60 days with no commits.
# Once a month this re-enables the trading and flow-log schedules (the API call resets the 60-day clock),
# so the bot can't quietly stop on a quiet month. Nothing else changes; it never touches the code.
name: keepalive

on:
  schedule:
    - cron: "41 15 3 * *"     # the 3rd of every month, 15:41 UTC
  workflow_dispatch:

permissions:
  actions: write            # needed to re-enable workflows; nothing else

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in options-agent.yml flowlog.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "enabled $wf" || echo "could not enable $wf"
          done
