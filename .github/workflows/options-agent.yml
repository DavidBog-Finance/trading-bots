# PORTFOLIO 1K OPTIONS AGENT on GitHub's servers (free on a public repo).
# Each market day one long run starts around the open and checks every 15 seconds until 4:20 pm
# New York. GitHub jobs max out at 6 hours, so an hourly trigger starts a second run that picks
# up where the first stopped (memory is carried in the Actions cache). Between runs, the stop
# order resting at Alpaca protects any open trade.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY   Alpaca PAPER keys
#   CLAUDE_CODE_OAUTH_TOKEN             from `claude setup-token` on your Mac (your Claude plan, no API key)
#   NTFY_TOPIC, CONTROL_TOPIC           phone alerts and phone commands
#   CONTROL_PIN (optional)              a short number; commands that change anything must include it ("kill 1k 4821")
#   HEALTHCHECK_URL (optional)          healthchecks.io ping URL: warns you if a weekday session never starts
# Variables: NET_DEPOSITS_OVERRIDE (your paper balance, e.g. 1000). Optional P1K_* overrides (portfolio1k/settings.py).
#
# PUBLIC REPO NOTE: run logs are public. Keys never appear in them (GitHub masks secrets), but trades,
# balances and Claude's reasons do. Fine for paper; switch the repo to private or move to your own
# computer before real money.
#
# Moving to your own always-on computer: set the repository variable RUNNER=box. This schedule then
# stops so nothing trades twice; the buttons below still work as a backup.
name: options-agent

on:
  schedule:
    # GitHub's timer is best-effort and skipped most of these on 11/23-11/24, so there are many tries,
    # starting before the open (an early run waits for 9:30). Only one has to land: each run then
    # starts the next one itself (see "Hand off" below) until the session is over.
    - cron: "17,47 10-20 * * 1-5"   # every 30 min at :17/:47 (the top of the hour is GitHub's busiest)
                                    #   10:17-20:47 UTC = 5:17 am-3:47 pm New York in winter
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: status
        type: choice
        options: [status, scorecard, run-now, close-trade, kill, export-memory]

permissions:
  contents: read            # this workflow only reads the code; it never writes to the repo
  actions: write            # lets a run start the next run (hand-off); nothing else

concurrency:
  # Trading runs queue one after another. The buttons (status, kill, ...) get their own lines, so they run
  # at once during a session and never cancel the waiting hand-off run.
  group: options-agent-${{ (github.event_name == 'schedule' || inputs.action == 'run-now') && 'trade' || inputs.action }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.RUNNER != 'box'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CONTROL_TOPIC: ${{ secrets.CONTROL_TOPIC }}
      CONTROL_PIN: ${{ secrets.CONTROL_PIN }}
      # Optional: a healthchecks.io ping URL. Each scheduled run pings it when it starts, so healthchecks.io
      # can text/email you if a weekday morning passes with no run (GitHub delayed or skipped it).
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      I_UNDERSTAND_LIVE_RISK: ${{ vars.I_UNDERSTAND_LIVE_RISK || 'no' }}
      NET_DEPOSITS_OVERRIDE: ${{ vars.NET_DEPOSITS_OVERRIDE }}
      # pro = your Claude plan via CLAUDE_CODE_OAUTH_TOKEN. api = pay-per-use API key (secret ANTHROPIC_API_KEY,
      # model in variable AGENT_MODEL, daily cap in CLAUDE_DAILY_BUDGET_USD). Switch with the variable CLAUDE_BACKEND.
      CLAUDE_BACKEND: ${{ vars.CLAUDE_BACKEND || 'pro' }}
      ANTHROPIC_API_KEY: ${{ vars.CLAUDE_BACKEND == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
      NEWS_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5-5' }}
      CLAUDE_DAILY_BUDGET_USD: ${{ vars.CLAUDE_DAILY_BUDGET_USD || '1.00' }}
      CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
      CLAUDE_CALLS_PER_HOUR: ${{ vars.CLAUDE_CALLS_PER_HOUR || '20' }}
      LOCAL_LLM_ENABLED: "false"
      P1K_FULL_PORT: ${{ vars.P1K_FULL_PORT }}
      P1K_WATCHLIST: ${{ vars.P1K_WATCHLIST }}
      P1K_FOMC_DAYS: ${{ vars.P1K_FOMC_DAYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-lock.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.332   # pinned; bump after checking a status run
        continue-on-error: true   # Claude is optional: if this install breaks, trade on the rules alone
      - run: python -m pytest -q tests          # never trade on broken code

      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: |
            logs/portfolio1k.db
            logs/state.db
          key: p1k-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: p1k-state-

      - name: Check in with healthchecks.io
        # trading runs only: most days start from a hand-off or backup starter (run-now), not GitHub's timer
        if: (github.event_name == 'schedule' || inputs.action == 'run-now') && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL" || true
      - name: Trade the session
        id: trade
        if: (github.event_name == 'schedule' || inputs.action == 'run-now') && vars.RUNNER != 'box'
        # 330 min leaves ~25 min of the 355-min job for setup and for saving memory, even on a slow day
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          python -m portfolio1k run --max-minutes 330
      - name: Status to phone
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'status'
        run: python -m portfolio1k status
      - name: Scorecard
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'scorecard'
        run: python -m portfolio1k scorecard
      - name: Close the open trade
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'close-trade'
        # Also tell a run that is trading right now (it reads phone commands every 30 s)
        run: |
          [ -z "$CONTROL_TOPIC" ] || curl -s -o /dev/null -d "close 1k $CONTROL_PIN" "https://ntfy.sh/$CONTROL_TOPIC" || true
          python -c "from portfolio1k import runner; r = runner.Runner(); r.handle('close')"
      - name: Kill (sell everything and stop)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'kill'
        run: |
          [ -z "$CONTROL_TOPIC" ] || curl -s -o /dev/null -d "kill 1k $CONTROL_PIN" "https://ntfy.sh/$CONTROL_TOPIC" || true
          python -m portfolio1k kill

      - name: Export memory (for moving to your own computer; kept 3 days)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'export-memory'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio1k-memory
          path: |
            logs/portfolio1k.db
            logs/state.db
          retention-days: 3

      - name: Save memory
        # status, scorecard and export only read; saving their copy could replace a newer one
        if: >-
          always() && hashFiles('logs/portfolio1k.db') != '' &&
          (github.event_name == 'schedule' || contains(fromJSON('["run-now","kill","close-trade"]'), inputs.action))
        uses: actions/cache/save@v4
        with:
          path: |
            logs/portfolio1k.db
            logs/state.db
          key: p1k-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Hand off to a new run while the session still has time
        # A run lasts at most 330 min. Rather than hope GitHub's timer fires again, start the next run now;
        # it waits in line (concurrency) and picks up the memory saved above.
        # Also after a crash mid-session (not after a fast failure, which would just repeat all day)
        if: always() && !cancelled() && steps.trade.outcome != 'skipped' && steps.trade.outcome != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.trade.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ] && [ $(( $(date +%s) - ${T0:-0} )) -lt 600 ]; then
            echo "The trade step failed within 10 minutes; not handing off (the backup starters will retry)."
            exit 0
          fi
          if python -m portfolio1k more-today; then
            gh workflow run options-agent.yml --ref main -f action=run-now
          fi

      - name: Tell my phone if anything failed
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -s -H "Title: Options bot run failed" -H "Priority: high" -H "Tags: warning" -d "Open GitHub > Actions > options-agent for the log. An open trade keeps its stop at Alpaca, but nothing else manages it until the next run starts." "https://ntfy.sh/$NTFY_TOPIC"
      - name: Tell healthchecks.io the run failed
        if: failure() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail" || true
